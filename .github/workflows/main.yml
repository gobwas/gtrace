name: CI
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
jobs:
  test:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        go: [ 'oldstable', 'stable' ]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}
        cache: false

    - name: Go Env
      run: |
        go env

    # Regenerates every test file for every GOOS/GOARCH combination and runs
    # the tests.
    - name: Test
      run: |
        make test

    # Generated code must be gofmt-clean as emitted.
    - name: Check gofmt
      run: |
        files=$(gofmt -l .)
        if [ -n "$files" ]; then
          echo "gofmt reported unformatted files:"
          echo "$files"
          exit 1
        fi
